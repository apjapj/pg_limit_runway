# .github/workflows/ci.yml: lint (make lint; every database-free check) and the scenario suite on
# every stable PostgreSQL version, 14 to 18, with the pgTAP tests first. ci/job.sh does a job's work.
name: ci
on:
  push:
  pull_request:
# Least privilege, stated rather than inherited. These jobs check the repository out and
# read a database; none of them writes to the repository, creates a release, or needs a
# token wider than read access to the contents. Declaring it here means a later change
# cannot quietly widen it, and it matches what the secret scan workflows in this family
# already declare.
permissions:
  contents: read

jobs:
  # Build the PGXN package and validate META.json with PGXN's own validator. On a tag it uses that
  # tag; on a PR it uses the control version's tag if it exists, otherwise it validates unreleased
  # metadata and skips the package, so a release PR before the tag is not red.
  pgxn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build the package and validate META.json
        run: |
          set -euo pipefail
          mkdir -p build/pgxn
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(sed -n "s/^default_version[[:space:]]*=[[:space:]]*'\([^']*\)'.*/\1/p" *.control)
            tag="v${version}"
          fi
          if git rev-parse --verify --quiet "${tag}^{commit}" >/dev/null; then
            version="${tag#v}"
            echo "building from tag $tag"
            ./scripts/pgxn-meta.py --tag "$tag" --output build/pgxn/META.json
            ./scripts/pgxn-meta.py --tag "$tag" --package "build/pgxn/pg_limit_runway-${version}.zip"
          else
            echo "no tag $tag yet: validating unreleased metadata only"
            ./scripts/pgxn-meta.py --check --unreleased --output build/pgxn/META.json
          fi
          docker run --rm -v "$PWD/build/pgxn:/work" -w /work \
            pgxn/pgxn-tools@sha256:53e79ef1c8b9a0ee88b51e89b36fd30c46c9f2326aec0cde1d7f66e47ad719ff \
            validate_pgxn_meta META.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # scripts/lint.sh, not `make lint`: the Makefile needs pgxs.mk to parse, and a container can
      # have pg_config and no server-dev package, which stopped `make lint` here before any check
      # ran. The script is the list of checks, so one added there cannot be forgotten here;
      # scripts/check-ci-parity.sh holds this line to the Forgejo copy's.
      - run: ./scripts/lint.sh
      - run: for s in scenarios/*.sh ci/*.sh scripts/*.sh; do bash -n "$s" || exit 1; done
  scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every stable version in the supported range, not a sample of it. 14 and 18 were the whole
        # matrix until this, so 15, 16 and 17 were never run anywhere. 19 is the current pre-release:
        # its image needs the include form and a separate apt major, as pg_lock_tree does it.
        include:
          - pg_version: "14"
            apt_version: "14"
          - pg_version: "15"
            apt_version: "15"
          - pg_version: "16"
            apt_version: "16"
          - pg_version: "17"
            apt_version: "17"
          - pg_version: "18"
            apt_version: "18"
          - pg_version: "19rc1"
            apt_version: "19"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client libtap-parser-sourcehandler-pgtap-perl
      - run: ./ci/job.sh ${{ matrix.pg_version }} ${{ matrix.apt_version }}

  # One command, the same in both copies: check-defects.sh picks container mode here (Docker is on
  # this runner) and local mode on the Forgejo copy (its runner is a PostgreSQL and has no Docker).
  # scripts/check-ci-parity.sh holds the two to this. See defects/README.md.
  defects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make defects PG=18
