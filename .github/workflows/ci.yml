# .github/workflows/ci.yml: lint (make lint; every database-free check) and the scenario suite on
# every stable PostgreSQL version, 14 to 18, with the pgTAP tests first. ci/job.sh does a job's work.
name: ci
on:
  push:
  pull_request:
# Least privilege, stated rather than inherited. These jobs check the repository out and
# read a database; none of them writes to the repository, creates a release, or needs a
# token wider than read access to the contents. Declaring it here means a later change
# cannot quietly widen it, and it matches what the secret scan workflows in this family
# already declare.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # make lint, not the checks one by one. The Makefile's lint target is the list, so a check
      # added there cannot be forgotten here; before this, two of them were missing from both CI
      # lint jobs for exactly that reason.
      - run: make lint
      - run: for s in scenarios/*.sh ci/*.sh scripts/*.sh; do bash -n "$s" || exit 1; done
  scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every stable version in the supported range, not a sample of it. 14 and 18 were the whole
        # matrix until this, so 15, 16 and 17 were never run anywhere. All three pass on this harness,
        # run by hand first, with their evidence committed alongside.
        pg: ["14", "15", "16", "17", "18"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client libtap-parser-sourcehandler-pgtap-perl
      - run: ./ci/job.sh ${{ matrix.pg }}
